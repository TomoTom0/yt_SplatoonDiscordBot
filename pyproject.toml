[project]
name = "yt-splatoondiscordbot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "TomoTom0", email = "tomoIris427+GitHub@gmail.com" }
]
dependencies = [
    "discord-py>=2.5.2",
    "requests>=2.32.3",
    "asyncio>=3.4.3",
    "bs4>=0.0.2",
    "beautifulsoup4>=4.13.4",
    "msgpack-python>=0.5.6",
    "packaging>=25.0",
    "pymmh3>=0.0.5",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/yt_splatoondiscordbot"]
